[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biddelta"
version = "0.1.0"
description = "Deterministic amendment review foundation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.146.0", "pydantic==2.14.1", "uvicorn==0.54.0", "PyMuPDF==1.28.2", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
